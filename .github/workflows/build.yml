name: "Build — ISOs & Containers"

on:
  push:
    branches: [main]
    paths:
      # ISOs
      - "profiles/**"
      - "hosts/common/**"
      - "hosts/server-iso/**"
      - "hosts/live-gui/**"
      - "flake-modules/isos.nix"
      # Containers
      - "tools/*/container.nix"
      - "tools/nvim/**"
      - "flake-modules/containers.nix"
      # Shared
      - "flake.nix"
      - "flake.lock"
      - "lib/**"
      - "pkgs/**"

jobs:
  build-isos:
    name: "ISO — ${{ matrix.name }}"
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: server-iso
            attr: "packages.x86_64-linux.server-iso"
          - name: live-gui
            attr: "packages.x86_64-linux.live-gui"

    steps:
      - uses: actions/checkout@v4

      - uses: cachix/install-nix-action@v27
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
          extra_nix_config: |
            extra-substituters = https://cache.sergioribera.rs/main
            extra-trusted-public-keys = main:NnVmqBjdfyyL4tGgoTw17lUMDgulJ75+67pOsJupnS4=

      - uses: cachix/cachix-action@v15
        with:
          name: sss
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
        continue-on-error: true

      - name: Build ${{ matrix.name }}
        run: nix build '.#${{ matrix.attr }}' --print-build-logs

      - name: Upload ISO artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: result/iso/*.iso
          if-no-files-found: ignore
          retention-days: 7

  build-containers:
    name: "Container — ${{ matrix.name }}"
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.tag }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: nvim-container
            attr: "packages.x86_64-linux.nvim-container"
            image: nvim

    steps:
      - uses: actions/checkout@v4

      - name: Set version tag
        id: version
        run: echo "tag=$(date -u +%Y-%m-%d)-$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - uses: cachix/install-nix-action@v27
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
          extra_nix_config: |
            extra-substituters = https://cache.sergioribera.rs/main
            extra-trusted-public-keys = main:NnVmqBjdfyyL4tGgoTw17lUMDgulJ75+67pOsJupnS4=

      - uses: cachix/cachix-action@v15
        with:
          name: sss
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
        continue-on-error: true

      - name: Build ${{ matrix.name }}
        run: nix build '.#${{ matrix.attr }}' --print-build-logs

      - name: Load and push to GHCR
        env:
          OWNER: ${{ github.repository_owner }}
          IMAGE: ${{ matrix.image }}
          VERSION: ${{ steps.version.outputs.tag }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ACTOR: ${{ github.actor }}
        run: |
          OWNER_LC="${OWNER,,}"
          echo "$GH_TOKEN" | docker login ghcr.io -u "$ACTOR" --password-stdin
          LOADED=$(docker load < result | grep "Loaded image:" | awk '{print $NF}')
          docker tag "$LOADED" "ghcr.io/${OWNER_LC}/${IMAGE}:latest"
          docker tag "$LOADED" "ghcr.io/${OWNER_LC}/${IMAGE}:${VERSION}"
          docker push "ghcr.io/${OWNER_LC}/${IMAGE}:latest"
          docker push "ghcr.io/${OWNER_LC}/${IMAGE}:${VERSION}"

  release:
    name: "Release"
    needs: [build-isos, build-containers]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Set version tag
        id: version
        run: echo "tag=$(date -u +%Y-%m-%d)-$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - name: Download ISO artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: ${{ steps.version.outputs.tag }}
          body: |
            **Commit**: ${{ github.sha }}

            ### ISOs
            - `server-iso` — headless appliance (boot directly, no install needed)
            - `live-gui` — live GUI ISO (boot directly, no install needed)

            ### Containers
            - `ghcr.io/${{ github.repository_owner }}/nvim:${{ steps.version.outputs.tag }}`
          files: artifacts/**/*.iso
          fail_on_unmatched_files: false
